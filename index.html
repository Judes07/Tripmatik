<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ömoş & Diloş: Tripmatik Platinum</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD Sürümleri - Global Değişken Sağlar) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone (Sadece React Preset ile kısıtlandırıldı) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Firebase Global Compat SDK'ları -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .bg-animated {
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px), radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            animation: moveBg 15s linear infinite;
        }
        @keyframes moveBg { 0% { background-position: 0 0, 20px 20px; } 100% { background-position: 40px 40px, 60px 60px; } }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px -5px rgba(244, 63, 94, 0.15);
            border-color: rgba(244, 63, 94, 0.3);
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
            background: #fff; border: 3px solid #f43f5e; cursor: pointer; margin-top: -10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer;
            background: linear-gradient(to right, #60a5fa, #c084fc, #f43f5e); border-radius: 3px;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-enter { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-enter { animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .wheel-spin { transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
    </style>
</head>
<body class="overflow-x-hidden">
    <!-- Arka Plan -->
    <div class="bg-animated"></div>
    <div id="root"></div>

    <!-- DİKKAT: data-presets="react" diyerek Babel'in gizli import eklemesi engellenmiştir! -->
    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo } = React;

        // YENİ FİREBASE VERİTABANI BİLGİLERİ (tripmatikdata)
        const firebaseConfig = {
            apiKey: "AIzaSyDFMsBnX3Uj1AeoJMsebRKs8yFKhIAsTLw",
            authDomain: "tripmatikdata.firebaseapp.com",
            projectId: "tripmatikdata",
            storageBucket: "tripmatikdata.firebasestorage.app",
            messagingSenderId: "327861092059",
            appId: "1:327861092059:web:6f2dd0a870a89f4187d6fe",
            measurementId: "G-2Q4XC62HYX"
        };
        const GEMINI_API_KEY = "AQ.Ab8RN6Iw7Izhr1lQBeQ_fqZywdu09jrOqZ6MStk5ydLkdS8HKA";

        // Firebase Başlatma
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Güvenli İkon Tanımlamaları (Destructuring olmadan)
        const Icons = {
            HeartCrack: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="m12 13-3-3 2-2-1.5-1.5"/></svg> },
            Trash2: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 20} height={props.size || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg> },
            Zap: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 20} height={props.size || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> },
            CheckCircle: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 20} height={props.size || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> },
            X: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 20} height={props.size || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> },
            Bot: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 20} height={props.size || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg> },
            Clock: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 12} height={props.size || 12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> },
            Share: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 20} height={props.size || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> },
            Edit: function(props) { return <svg className={props.className || ""} xmlns="http://www.w3.org/2000/svg" width={props.size || 20} height={props.size || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> }
        };

        const MOODS = [
            { id: 'angry', emoji: '😡', label: 'Sinirli', bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-600' },
            { id: 'sad', emoji: '🥺', label: 'Kırgın', bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-600' },
            { id: 'eyeroll', emoji: '🙄', label: 'Sabır Ver', bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-600' },
            { id: 'ignored', emoji: '😒', label: 'Soğuk', bg: 'bg-gray-50', border: 'border-gray-300', text: 'text-gray-600' }
        ];

        const WHEEL_OPTIONS = ["Öpücük 😘", "Starbucks ☕", "Tatlı/Waffle 🧇", "Sarılmak 🤗", "Masaj 💆‍♂️", "Çiçek Al 💐", "Haklısın De 👍", "Barış! 🎉"];

        function Toast(props) {
            const isError = props.type === 'error';
            return (
                <div className={`toast-enter fixed top-4 right-4 z-[9999] flex items-center gap-3 px-5 py-3 rounded-2xl shadow-xl border backdrop-blur-md ${isError ? 'bg-red-50 border-red-200 text-red-600' : 'bg-emerald-50 border-emerald-200 text-emerald-700'}`}>
                    {isError ? <Icons.X size={18} /> : <Icons.CheckCircle size={18} />}
                    <span className="text-sm font-bold">{props.message}</span>
                    <button onClick={props.onClose} className="opacity-50 hover:opacity-100 ml-2"><Icons.X size={14}/></button>
                </div>
            );
        }

        function TripTimer(props) {
            const [timeText, setTimeText] = useState("");
            
            useEffect(() => {
                if (!props.timestamp) return;
                const calculate = () => {
                    const ts = typeof props.timestamp.toMillis === 'function' ? props.timestamp.toMillis() : (props.timestamp.seconds * 1000);
                    const diffMs = Date.now() - ts;
                    const mins = Math.floor(diffMs / 60000);
                    const hrs = Math.floor(mins / 60);
                    const days = Math.floor(hrs / 24);

                    if (days > 0) setTimeText(days + " gündür küs");
                    else if (hrs > 0) setTimeText(hrs + " saattir küs");
                    else if (mins > 0) setTimeText(mins + " dk'dır küs");
                    else setTimeText("Az önce başladı");
                };
                calculate();
                const interval = setInterval(calculate, 30000);
                return () => clearInterval(interval);
            }, [props.timestamp]);

            if (!timeText) return null;
            return (
                <span className="text-[10px] font-black bg-rose-50 text-rose-500 px-2.5 py-1 rounded-md flex items-center gap-1.5 border border-rose-100 mt-1">
                    <Icons.Clock size={11} className="animate-pulse" /> {timeText}
                </span>
            );
        }

        function WheelModal(props) {
            const [spinning, setSpinning] = useState(false);
            const [rotation, setRotation] = useState(0);
            const [result, setResult] = useState("");

            if (!props.isOpen) return null;

            const spinWheel = () => {
                if (spinning) return;
                setSpinning(true); 
                setResult("");
                
                const randomDegrees = Math.floor(Math.random() * 360) + 1440; 
                const newRotation = rotation + randomDegrees;
                setRotation(newRotation);
                
                setTimeout(() => {
                    setSpinning(false);
                    const sliceAngle = 360 / WHEEL_OPTIONS.length;
                    const normalizedRotation = newRotation % 360;
                    const index = Math.floor((360 - normalizedRotation + (sliceAngle / 2)) % 360 / sliceAngle);
                    const selected = WHEEL_OPTIONS[index];
                    setResult(selected);
                    if(window.confetti) window.confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                    props.addToast("Karar Verildi: " + selected + " 🎡");
                }, 4000);
            };

            return (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-enter">
                    <div className="bg-white rounded-[32px] p-6 w-full max-w-sm shadow-2xl relative">
                        <button onClick={props.onClose} className="absolute top-4 right-4 text-slate-400 hover:text-rose-500"><Icons.X size={24} /></button>
                        <h3 className="text-xl font-black text-center mb-6 text-rose-500 italic">Kader Çarkı</h3>
                        
                        <div className="relative w-56 h-56 mx-auto mb-6 flex items-center justify-center">
                            <div className="absolute -top-3 z-30 text-rose-500 text-3xl transform">▼</div>
                            <div className="w-full h-full rounded-full border-[6px] border-rose-200 shadow-inner overflow-hidden relative wheel-spin flex items-center justify-center" style={{ transform: "rotate(" + rotation + "deg)" }}>
                                {WHEEL_OPTIONS.map(function(opt, i) {
                                    const angle = i * (360 / WHEEL_OPTIONS.length);
                                    return (
                                        <div key={i} className="absolute h-full w-full origin-center flex justify-center text-[10px] font-bold text-slate-700" style={{ transform: "rotate(" + angle + "deg)" }}>
                                            <span className="mt-4">{opt}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        
                        {result ? <div className="text-center bg-rose-50 border border-rose-100 p-3 rounded-xl mb-4 font-bold text-rose-600 animate-enter">{result}</div> : null}
                        
                        <button onClick={spinWheel} disabled={spinning} className={`w-full py-3.5 rounded-xl font-bold text-white shadow-lg transition-all ${spinning ? 'bg-slate-400 cursor-not-allowed' : 'bg-gradient-to-r from-rose-500 to-purple-500 hover:scale-[1.02]'}`}>
                            {spinning ? "DÖNÜYOR..." : "ÇARK'I ÇEVİR"}
                        </button>
                    </div>
                </div>
            );
        }

        function GeminiModal(props) {
            const [aiMessage, setAiMessage] = useState("");
            const [loading, setLoading] = useState(false);

            useEffect(() => { 
                if (props.isOpen && props.trip) generateMessage(); 
            }, [props.isOpen, props.trip]);

            const generateMessage = () => {
                setLoading(true); 
                setAiMessage("");
                const prompt = "Sevgilim bana şu sebepten dolayı trip atıyor: " + props.trip.reason + ". Uyguladığı ceza ise: " + props.trip.action + ". Kendimi affettirmek için ona samimi, biraz esprili, içinde bol sevgi olan bir özür mesajı yazar mısın? Sadece mesajı ver.";
                
                const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + GEMINI_API_KEY;
                
                fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.candidates && data.candidates.length > 0) {
                        setAiMessage(data.candidates[0].content.parts[0].text);
                    } else {
                        throw new Error("Yapay Zeka cevap veremedi.");
                    }
                })
                .catch(function(err) {
                    setAiMessage("Hayatımın anlamı, seni kırdığım için çok üzgünüm. O güzel yüzün asılmasın, seni dünyalar kadar seviyorum! Affet beni ❤️");
                    props.addToast("Yapay zekaya ulaşılamadı, varsayılan mesaj oluşturuldu.", "error");
                })
                .finally(function() {
                    setLoading(false);
                });
            };

            const copyText = () => {
                const temp = document.createElement("textarea");
                temp.value = aiMessage;
                document.body.appendChild(temp);
                temp.select();
                navigator.clipboard.writeText(temp.value);
                document.body.removeChild(temp);
                props.addToast("Mesaj kopyalandı! Gidip gönlünü al 🥰");
            };

            if (!props.isOpen) return null;

            return (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-enter">
                    <div className="bg-white rounded-[32px] p-6 w-full max-w-sm shadow-2xl relative">
                        <button onClick={props.onClose} className="absolute top-4 right-4 text-slate-400 hover:text-rose-500"><Icons.X size={24} /></button>
                        <div className="flex items-center justify-center gap-2 mb-4 text-purple-600">
                            <Icons.Bot size={24} />
                            <h3 className="text-lg font-black italic">Yapay Zeka Asistanı</h3>
                        </div>
                        
                        <div className="bg-purple-50 border border-purple-100 p-4 rounded-2xl mb-4 text-sm font-medium text-slate-700 min-h-[120px] max-h-64 overflow-y-auto italic">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-full text-purple-400 gap-2 opacity-70">
                                    <div className="animate-spin rounded-full h-6 w-6 border-2 border-purple-500 border-t-transparent"></div>
                                    <span>Gemini kelimeleri seçiyor...</span>
                                </div>
                            ) : aiMessage}
                        </div>

                        <button onClick={copyText} disabled={loading || !aiMessage} className="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition-colors">
                            KOPYALA VE GÖNDER
                        </button>
                    </div>
                </div>
            );
        }

        function MainApp() {
            const [trips, setTrips] = useState([]);
            const [reason, setReason] = useState("");
            const [action, setAction] = useState("");
            const [intensity, setIntensity] = useState(5);
            const [mood, setMood] = useState(MOODS[0]);
            
            const [toasts, setToasts] = useState([]);
            const [activeTab, setActiveTab] = useState('active'); 
            
            const [wheelOpen, setWheelOpen] = useState(false);
            const [aiOpen, setAiOpen] = useState(false);
            const [selectedTripForAi, setSelectedTripForAi] = useState(null);
            
            const [editingId, setEditingId] = useState(null);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            const [dbError, setDbError] = useState(null);

            const addToast = function(msg, type) {
                const toastType = type || 'success';
                const id = Date.now();
                setToasts(function(prev) {
                    return prev.concat([{ id: id, msg: msg, type: toastType }]);
                });
                setTimeout(function() {
                    setToasts(function(prev) {
                        return prev.filter(function(t) { return t.id !== id; });
                    });
                }, 3000);
            };

            useEffect(() => {
                let unsubscribeDb = null;
                auth.signInAnonymously().catch(function(err) {
                    setDbError("Auth Hatası: " + err.message);
                });

                const unsubscribeAuth = auth.onAuthStateChanged(function(user) {
                    if (user) {
                        if (unsubscribeDb) unsubscribeDb();
                        unsubscribeDb = db.collection('omos_trips')
                            .orderBy('timestamp', 'desc')
                            .onSnapshot(
                                function(snapshot) {
                                    const tripData = snapshot.docs.map(function(doc) {
                                        return Object.assign({ id: doc.id }, doc.data());
                                    });
                                    setTrips(tripData);
                                    setDbError(null);
                                },
                                function(err) {
                                    setDbError("Okuma Hatası: " + err.message);
                                }
                            );
                    }
                });
                return function() {
                    if (unsubscribeDb) unsubscribeDb();
                    unsubscribeAuth();
                };
            }, []);

            const handleAdd = function(e) {
                e.preventDefault();
                if (!reason.trim()) return addToast("Lütfen bir sebep girin!", "error");
                if (!auth.currentUser) return addToast("Bağlantı bekleniyor...", "error");

                if(editingId) {
                    db.collection('omos_trips').doc(editingId).update({
                        reason: reason,
                        action: action || "Belirtilmedi",
                        intensity: intensity,
                        mood: mood
                    }).then(function() {
                        setEditingId(null);
                        addToast("Kriz başarıyla güncellendi!");
                    }).catch(function() { addToast("Kayıt başarısız.", "error"); });
                } else {
                    db.collection('omos_trips').add({
                        reason: reason,
                        action: action || "Belirtilmedi",
                        intensity: intensity,
                        mood: mood,
                        resolved: false,
                        date: new Date().toLocaleDateString('tr-TR'),
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        uid: auth.currentUser.uid
                    }).then(function() {
                        addToast("Kriz sisteme işlendi! 🚨");
                    }).catch(function() { addToast("Kayıt başarısız.", "error"); });
                }
                setReason(""); setAction(""); setIntensity(5); setMood(MOODS[0]);
            };

            const toggleResolve = function(id, currentState) {
                db.collection('omos_trips').doc(id).update({ resolved: !currentState })
                .then(function() {
                    if (!currentState) { 
                        if(window.confetti) window.confetti({ particleCount: 150, spread: 60 });
                        addToast("Harika! Barış sağlandı 🥰");
                    }
                }).catch(function() { addToast("Durum güncellenemedi.", "error"); });
            };

            const handleDelete = function(id) {
                db.collection('omos_trips').doc(id).delete()
                .then(function() {
                    setDeleteConfirmId(null);
                    addToast("Kayıt tarihin tozlu sayfalarına gömüldü.");
                }).catch(function() { addToast("Silinemedi.", "error"); });
            };
            
            const startEditing = function(trip) {
                setEditingId(trip.id);
                setReason(trip.reason);
                setAction(trip.action);
                setIntensity(trip.intensity);
                setMood(trip.mood);
                addToast("Kriz düzenleniyor... ✍️");
            }

            const shareTrip = function(trip) {
                const text = "📢 *ÖMOŞ & DİLOŞ TRİPMATİK* 📢\n\n🎯 *Olay:* " + trip.reason + "\n⚖️ *Ceza:* " + trip.action + "\n🔥 *Şiddet:* " + trip.intensity + "/10\n\n_Hemen gönül alınması rica olunur!_";
                const temp = document.createElement("textarea");
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                navigator.clipboard.writeText(temp.value);
                document.body.removeChild(temp);
                addToast("Tebligat kopyalandı! İstediğin yere yapıştır 📋");
            };

            const displayTrips = trips.filter(function(t) {
                return activeTab === 'active' ? !t.resolved : t.resolved;
            });

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-8 font-sans text-slate-800 min-h-screen pb-24">
                    {toasts.map(function(t) {
                        return <Toast key={t.id} message={t.msg} type={t.type} onClose={function() {
                            setToasts(function(prev) { return prev.filter(function(i) { return i.id !== t.id; }); });
                        }} />;
                    })}

                    <header className="text-center mb-10 relative z-10 animate-enter">
                        <div className="inline-flex relative mb-4">
                            <div className="absolute inset-0 bg-rose-400 blur-xl opacity-30 rounded-full animate-pulse"></div>
                            <div className="relative bg-white p-4 rounded-full shadow-lg border-2 border-rose-100 text-rose-500">
                                <Icons.HeartCrack size={32} />
                            </div>
                        </div>
                        <h1 className="text-4xl md:text-5xl font-black tracking-tight italic text-slate-800">
                            Ömoş & Diloş <span className="text-rose-500">Tripmatik</span>
                        </h1>
                        <p className="text-slate-500 font-bold mt-2 tracking-widest text-sm">TRIPMATIK DATA EDITION</p>
                    </header>

                    {dbError ? (
                        <div className="mb-8 bg-red-50 p-4 rounded-2xl border border-red-200 text-red-600 font-bold text-sm text-center shadow-sm">
                            ⚠️ Firebase Hatası: {dbError} <br/> (Konsoldan anonim girişi açmayı ve kuralları onaylamayı unutmayın!)
                        </div>
                    ) : null}

                    <div className="grid lg:grid-cols-12 gap-8 relative z-10">
                        <div className="lg:col-span-5">
                            <form onSubmit={handleAdd} className={`glass-panel p-6 md:p-8 rounded-[32px] sticky top-6 animate-enter border transition-all ${editingId ? 'border-yellow-400 shadow-yellow-100' : 'border-white/60'}`} style={{animationDelay: '0.1s'}}>
                                <h2 className="text-xl font-black mb-6 flex items-center gap-3">
                                    <span className={`text-white p-2.5 rounded-xl shadow-md ${editingId ? 'bg-yellow-500' : 'bg-rose-500'}`}>
                                        {editingId ? <Icons.Edit size={20}/> : <Icons.Zap size={20}/>}
                                    </span>
                                    {editingId ? "Krizi Düzenle" : "Yeni Kriz Bildirimi"}
                                </h2>

                                <div className="grid grid-cols-4 gap-3 mb-6">
                                    {MOODS.map(function(m) {
                                        return (
                                            <button type="button" key={m.id} onClick={function() { setMood(m); }} className={`flex flex-col items-center p-3 rounded-2xl border-2 transition-all ${mood.id === m.id ? m.bg + ' ' + m.border + ' scale-105 shadow-sm' : 'bg-white/60 border-transparent hover:bg-white'}`}>
                                                <span className="text-2xl mb-1">{m.emoji}</span>
                                                <span className={`text-[10px] font-bold ${mood.id === m.id ? m.text : 'text-slate-400'}`}>{m.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 ml-2 mb-1 block uppercase">Olay Ne?</label>
                                        <textarea required value={reason} onChange={function(e) { setReason(e.target.value); }} className="w-full p-4 bg-white/80 border border-slate-200 rounded-2xl text-sm outline-none focus:border-rose-300 focus:ring-2 focus:ring-rose-100 transition-all resize-none h-24 shadow-inner" placeholder="Neden trip atılıyor detaylandır..."></textarea>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-500 ml-2 mb-1 block uppercase">Uygulanan Ceza</label>
                                        <input type="text" value={action} onChange={function(e) { setAction(e.target.value); }} className="w-full p-4 bg-white/80 border border-slate-200 rounded-2xl text-sm outline-none focus:border-rose-300 focus:ring-2 focus:ring-rose-100 transition-all shadow-inner" placeholder="Örn: 2 saat konuşmamak, mesajlara geç dönmek" />
                                    </div>

                                    <div className="bg-white/80 p-5 rounded-2xl border border-slate-200 shadow-inner">
                                        <div className="flex justify-between items-center text-sm font-black mb-4">
                                            <span className="text-slate-600">Şiddet Seviyesi</span>
                                            <span className="bg-rose-100 text-rose-600 px-3 py-1 rounded-lg">{intensity} / 10</span>
                                        </div>
                                        <input type="range" min="1" max="10" value={intensity} onChange={function(e) { setIntensity(Number(e.target.value)); }} />
                                    </div>

                                    <button type="submit" className={`w-full mt-2 text-white font-black py-4 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2 ${editingId ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-slate-800 hover:bg-slate-900'}`}>
                                        {editingId ? <React.Fragment><Icons.Edit size={20}/> GÜNCELLE</React.Fragment> : <React.Fragment><Icons.Zap size={20}/> SİSTEME İŞLE</React.Fragment>}
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div className="lg:col-span-7 space-y-6">
                            <div className="glass-panel p-4 md:p-5 rounded-3xl flex justify-between items-center animate-enter" style={{animationDelay: '0.2s'}}>
                                <div>
                                    <h4 className="font-bold text-slate-800">Kararsız mısın?</h4>
                                    <p className="text-xs font-medium text-slate-500">Cezayı veya barışma yöntemini çarka bırak.</p>
                                </div>
                                <button onClick={function() { setWheelOpen(true); }} className="bg-rose-500 hover:bg-rose-600 text-white font-black text-xs px-5 py-3 rounded-xl shadow-md transition-all active:scale-95">
                                    ÇARK ÇEVİR 🎡
                                </button>
                            </div>

                            <div className="flex bg-white/60 backdrop-blur-md p-1.5 rounded-2xl shadow-sm border border-white/50 animate-enter" style={{animationDelay: '0.3s'}}>
                                <button onClick={function() { setActiveTab('active'); }} className={`flex-1 py-2.5 text-xs font-black rounded-xl transition-all ${activeTab === 'active' ? 'bg-white text-rose-500 shadow-sm' : 'text-slate-400 hover:bg-white/40'}`}>
                                    AKTİF KRİZLER ({trips.filter(function(t) { return !t.resolved; }).length})
                                </button>
                                <button onClick={function() { setActiveTab('resolved'); }} className={`flex-1 py-2.5 text-xs font-black rounded-xl transition-all ${activeTab === 'resolved' ? 'bg-white text-emerald-500 shadow-sm' : 'text-slate-400 hover:bg-white/40'}`}>
                                    BARIŞILANLAR ({trips.filter(function(t) { return t.resolved; }).length})
                                </button>
                            </div>

                            <div className="space-y-4">
                                {displayTrips.length === 0 ? (
                                    <div className="text-center p-10 bg-white/50 rounded-3xl border border-dashed border-slate-300">
                                        <div className="text-4xl mb-3 opacity-50">🕊️</div>
                                        <p className="text-slate-500 font-bold text-sm">Burada şu an her şey güllük gülistanlık...</p>
                                    </div>
                                ) : (
                                    displayTrips.map(function(trip, idx) {
                                        return (
                                        <div key={trip.id} className={`glass-card p-6 rounded-[28px] animate-enter ${trip.resolved ? 'opacity-80 grayscale-[0.2]' : ''}`} style={{animationDelay: (0.1 * idx) + 's'}}>
                                            
                                            <div className="flex justify-between items-start mb-4">
                                                <div className="flex gap-4">
                                                    <div className="text-5xl drop-shadow-sm">{trip.mood ? trip.mood.emoji : ''}</div>
                                                    <div className="flex flex-col pt-1">
                                                        <span className="text-[10px] font-black text-slate-400 tracking-wider uppercase mb-1">{trip.date}</span>
                                                        {!trip.resolved ? <TripTimer timestamp={trip.timestamp} /> : null}
                                                    </div>
                                                </div>
                                                
                                                <div className="flex items-center gap-1.5">
                                                    {!trip.resolved ? (
                                                        <button onClick={function() { setSelectedTripForAi(trip); setAiOpen(true); }} className="p-2.5 rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-100 transition-colors tooltip" title="Yapay Zeka Özür Metni">
                                                            <Icons.Bot size={20} />
                                                        </button>
                                                    ) : null}
                                                    {!trip.resolved ? (
                                                        <button onClick={function() { startEditing(trip); }} className="p-2.5 rounded-xl bg-yellow-50 text-yellow-600 hover:bg-yellow-100 transition-colors tooltip" title="Düzenle">
                                                            <Icons.Edit size={20} />
                                                        </button>
                                                    ) : null}
                                                    <button onClick={function() { shareTrip(trip); }} className="p-2.5 rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors tooltip" title="Tebligat Paylaş">
                                                        <Icons.Share size={20} />
                                                    </button>
                                                    <button onClick={function() { toggleResolve(trip.id, trip.resolved); }} className={`p-2.5 rounded-xl transition-colors tooltip ${trip.resolved ? 'bg-slate-100 text-slate-500 hover:bg-slate-200' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'}`} title={trip.resolved ? "Geri Al" : "Barışıldı!"}>
                                                        <Icons.CheckCircle size={20} />
                                                    </button>
                                                    
                                                    {deleteConfirmId === trip.id ? (
                                                        <div className="flex items-center gap-1 bg-red-100 p-1 rounded-xl ml-1">
                                                            <button onClick={function() { handleDelete(trip.id); }} className="bg-red-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-sm">SİL</button>
                                                            <button onClick={function() { setDeleteConfirmId(null); }} className="bg-white text-slate-600 text-[10px] font-bold px-3 py-1.5 rounded-lg">İPTAL</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={function() { setDeleteConfirmId(trip.id); }} className="p-2.5 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 transition-colors ml-1 tooltip" title="Kaydı Sil">
                                                            <Icons.Trash2 size={20} />
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            
                                            <h3 className={`text-lg md:text-xl font-black text-slate-800 leading-tight mb-4 ${trip.resolved ? 'line-through decoration-emerald-400 decoration-2 opacity-70' : ''}`}>
                                                {trip.reason}
                                            </h3>
                                            
                                            <div className="flex items-center gap-3 bg-slate-50/80 p-3.5 rounded-2xl border border-slate-100">
                                                <div className="bg-white px-2 py-1 rounded-lg text-[10px] font-black tracking-wider text-slate-400 border shadow-sm">CEZA</div>
                                                <div className="text-sm font-bold text-slate-700">{trip.action}</div>
                                            </div>
                                        </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                    
                    <WheelModal isOpen={wheelOpen} onClose={function() { setWheelOpen(false); }} addToast={addToast} />
                    <GeminiModal isOpen={aiOpen} onClose={function() { setAiOpen(false); }} trip={selectedTripForAi} addToast={addToast} />
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<MainApp />);
    </script>
</body>
</html>
